# Every setting that differs between machines comes from an environment variable, with a
# local-development default. docs/deploy/DEPLOY.md lists what the hosted demo sets.
server:
  # Hosting platforms (Render among them) say which port to listen on in $PORT.
  port: ${PORT:8080}

spring:
  application:
    name: relaycrm
  datasource:
    # The application connects as a restricted role: no superuser, no BYPASSRLS,
    # so PostgreSQL row-level security applies to every query it runs.
    url: ${DB_URL:jdbc:postgresql://localhost:5433/relaycrm}
    username: ${DB_APP_USER:relaycrm_app}
    password: ${DB_APP_PASSWORD:app_secret}
    hikari:
      # A small instance (512 MB) and a free database tier both do better with fewer connections.
      maximum-pool-size: ${DB_POOL_SIZE:10}
  flyway:
    # Migrations run as the schema owner, a different (privileged) role.
    user: ${DB_OWNER_USER:relaycrm_owner}
    password: ${DB_OWNER_PASSWORD:owner_secret}
    # Fail with "Unable to resolve location ..." if the migration files are missing,
    # instead of starting against an empty schema and failing later with an unrelated error.
    fail-on-missing-locations: true
    placeholders:
      appUser: ${spring.datasource.username}
      appPassword: ${spring.datasource.password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        # Only the health check, for the hosting platform: {"status":"UP"} or 503. Nothing else.
        include: health
  endpoint:
    health:
      show-details: never
