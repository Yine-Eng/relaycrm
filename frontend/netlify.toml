# Netlify settings for the public demo site. In the Netlify UI, set the site's
# "Base directory" to "frontend"; paths below are relative to it.
# See docs/deploy/DEPLOY.md.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  # The "View as" switcher with the six demo users (their API keys are public demo keys).
  VITE_DEMO_MODE = "true"
  # The "Public demo: seeded data, anyone can change it." banner. Only this site sets it.
  VITE_PUBLIC_DEMO = "true"

# The API, served from the same origin so the browser needs no CORS: Netlify forwards
# every /api request to the Render service "relaycrm-api".
[[redirects]]
  from = "/api/*"
  to = "https://relaycrm-api.onrender.com/api/:splat"
  status = 200
  force = true

# Single-page app: every other path is handled by the app's router.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
