# Local PostgreSQL. Host port 5433 so it does not clash with a locally installed Postgres.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: relaycrm
      POSTGRES_USER: relaycrm_owner      # owns the schema and runs migrations (superuser: bypasses RLS)
      POSTGRES_PASSWORD: owner_secret
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relaycrm_owner -d relaycrm"]
      interval: 2s
      timeout: 2s
      retries: 30
